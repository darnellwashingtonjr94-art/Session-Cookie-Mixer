version: '3.8'

services:
  # Service 1: Validates JavaScript code quality
  linter:
    build:
      context: .
      dockerfile: Dockerfile.lint
    volumes:
      - .:/app

  # Service 2: Builds and packages the extension .zip file
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    depends_on:
      - linter
